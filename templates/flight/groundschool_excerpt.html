<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{ title }} p.{{ pages[0] }}</title>
<style>
html,body{height:100%;margin:0;background:#14212e;font-family:system-ui,sans-serif}
.bar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:#14212e;color:#fff}
.bar a,.bar button{background:#fff;color:#14212e;font-weight:800;border:0;border-radius:999px;padding:10px 16px;text-decoration:none;font-size:1rem;white-space:nowrap}
.bar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}
.wrap{position:absolute;top:calc(56px + env(safe-area-inset-top));left:0;right:0;bottom:0;overflow:auto;-webkit-overflow-scrolling:touch}
.wrap iframe{width:100%;height:100%;border:0;background:#fff}
</style></head><body>
<div class="bar"><button type="button" id="back">&larr; Back to lesson</button>
<span>{{ title }} · p.{{ pages|join(', ') }}</span>
<a href="{{ pdf_url }}">Open PDF</a></div>
<div class="wrap"><iframe src="{{ pdf_url }}" title="{{ title }}"></iframe></div>
<script>
document.getElementById('back').onclick=function(){
  if(history.length>1){history.back();}else{window.close();}
};
</script></body></html>
