<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>CFI Sign Up - OpsHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>body { background: #0a4fb3; min-height: 100vh; }</style>
</head>
<body class="d-flex align-items-center">
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="text-center text-white mb-3">
        <i class="bi bi-person-badge" style="font-size:3rem;"></i>
        <h3 class="mt-2">New CFI Account</h3>
      </div>
      <div class="card p-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" value="{{ name }}" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" value="{{ username }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Instruction Rate ($/hr) <span class="text-muted small">(billed to students)</span></label>
            <input type="number" step="any" name="rate_per_hour" class="form-control" placeholder="e.g. 60">
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-bold">Create Account</button>
        </form>
        <p class="text-center small text-muted mt-3 mb-0">Already have an account? <a href="{{ url_for('flight.login') }}">Log in</a></p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
