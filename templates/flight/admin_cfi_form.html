{% extends "flight/base_flight.html" %}
{% block title %}Edit CFI - OpsHub{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-lg-6">
<div class="card p-4">
  <h4>Edit CFI: {{ cfi.name }}</h4>
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Full Name *</label>
      <input type="text" name="name" class="form-control" value="{{ cfi.name }}" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label">Username</label>
      <div><code>{{ cfi.username }}</code></div>
    </div>
    <div class="mb-3">
      <label class="form-label">Reset Password <span class="text-muted small">(leave blank to keep current)</span></label>
      <input type="text" name="password" class="form-control">
      <div class="form-text">Give the new password to this CFI so they can log in.</div>
    </div>
    <div class="mb-3">
      <label class="form-label">Instruction Rate ($/hr)</label>
      <input type="number" step="any" name="rate_per_hour" class="form-control" value="{{ cfi.rate_per_hour }}">
    </div>
    <div class="form-check mb-2">
      <input type="checkbox" class="form-check-input" name="active" id="active-check" {% if cfi.active %}checked{% endif %}>
      <label class="form-check-label" for="active-check">Active</label>
    </div>
    <div class="form-check mb-3">
      <input type="checkbox" class="form-check-input" name="is_admin" id="admin-check" {% if cfi.is_admin %}checked{% endif %}>
      <label class="form-check-label" for="admin-check">Admin (can manage all CFI accounts and reset passwords)</label>
    </div>
    <div class="d-flex justify-content-between">
      <a href="{{ url_for('flight.admin_cfis_list') }}" class="btn btn-outline-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary fw-bold">Save Changes</button>
    </div>
  </form>
</div>
</div>
</div>
{% endblock %}
