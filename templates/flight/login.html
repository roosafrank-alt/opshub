<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Log In - OpsHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>body { background: #0a4fb3; min-height: 100vh; }</style>
</head>
<body class="d-flex align-items-center">
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="text-center text-white mb-3">
        <i class="bi bi-airplane-engines" style="font-size:3rem;"></i>
        <h3 class="mt-2">Flight School</h3>
      </div>
      <div class="card p-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <div class="btn-group w-100 mb-3" role="group" id="role-toggle">
          <button type="button" class="btn {{ 'btn-primary' if role != 'student' else 'btn-outline-primary' }}" data-role="cfi">CFI / Admin</button>
          <button type="button" class="btn {{ 'btn-primary' if role == 'student' else 'btn-outline-primary' }}" data-role="student">Student</button>
        </div>
        <form method="post">
          <input type="hidden" name="role" id="role-input" value="{{ role }}">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" value="{{ username }}" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-bold">Log In</button>
        </form>
        <p class="text-center small text-muted mt-3 mb-0">New CFI? <a href="{{ url_for('flight.signup') }}">Create an account</a></p>
        <p class="text-center small text-muted mt-1 mb-0">Forgot your password? Ask an admin to reset it for you.</p>
      </div>
      <div class="text-center mt-3">
        <a href="{{ url_for('home_launcher') }}" class="text-white small"><i class="bi bi-arrow-left"></i> Back to Home</a>
      </div>
    </div>
  </div>
</div>
<script>
document.querySelectorAll('#role-toggle button').forEach(function (btn) {
  btn.addEventListener('click', function () {
    document.getElementById('role-input').value = btn.getAttribute('data-role');
    document.querySelectorAll('#role-toggle button').forEach(function (b) {
      b.className = 'btn btn-outline-primary';
    });
    btn.className = 'btn btn-primary';
  });
});
</script>
</body>
</html>
