<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>{% block title %}OpsHub{% endblock %} - OpsHub</title>
{% set app_identity = 'windsaloft' %}{% include "_app_identity.html" %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  :root { --fwk-navy: #14213d; --fwk-blue: #2b3fdb; --fwk-muted: #5a6472; }
  body { background: #fff; min-height: 100vh; }
  .login-brand { color: var(--fwk-navy); font-weight: 700; letter-spacing: .01em; }
  .login-tagline { color: var(--fwk-muted); font-size: .85rem; }
  .fwk-card { border: 1px solid #eef0f4; box-shadow: 0 10px 30px rgba(20,33,61,.08); border-radius: 12px; }
  .fwk-card label { color: var(--fwk-navy); font-weight: 600; font-size: .85rem; text-transform: uppercase; letter-spacing: .03em; }
  .fwk-card .form-control { border-radius: 8px; border-color: #dfe3ea; }
  .btn-fwk { background: var(--fwk-navy); border-color: var(--fwk-navy); color: #fff; text-transform: uppercase; letter-spacing: .05em; font-size: .9rem; padding: .65rem 1rem; }
  .btn-fwk:hover { background: #0d1b2a; border-color: #0d1b2a; color: #fff; }
</style>
</head>
<body class="d-flex align-items-center">
<div class="container py-4">
  <div class="row justify-content-center"><div class="col-md-5 col-lg-4">
    <h1 class="text-center login-brand mb-3 fs-2">OpsHub</h1>
    {% include "_flash_messages.html" %}
    <div class="fwk-card p-4">{% block body %}{% endblock %}</div>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
