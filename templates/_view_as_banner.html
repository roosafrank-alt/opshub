{% if viewing_as %}
<div class="bg-warning text-dark text-center py-1 small fw-bold">
  <i class="bi bi-eye"></i> Viewing as {{ viewing_as }} - everything works as it does for that role.
  <form action="{{ url_for('view_as_exit') }}" method="post" class="d-inline">
    <button type="submit" class="btn btn-link btn-sm p-0 ms-1 fw-bold text-dark text-decoration-underline align-baseline">Back to your normal view</button>
  </form>
</div>
{% endif %}
