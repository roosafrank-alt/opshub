{% extends "_public_page.html" %}
{% block title %}Forgot password{% endblock %}
{% block body %}
<h5 class="mb-2" data-change="PW-3"><i class="bi bi-key"></i> Forgot your password?</h5>
<p class="text-muted small">Type your username or email. If we have an email address for that account, we'll send a link to choose a new password.</p>
<form method="post">
  <div class="mb-3">
    <label class="form-label">Username or Email</label>
    <input type="text" name="who" class="form-control" autocomplete="username" required autofocus>
  </div>
  <button type="submit" class="btn btn-fwk w-100 fw-bold">Email Me a Link</button>
</form>
<p class="text-center small mt-3 mb-0"><a href="{{ url_for('home_launcher') }}">Back to log in</a></p>
{% endblock %}
