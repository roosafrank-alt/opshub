{% extends "base.html" %}
{% block title %}Print Project Code - {{ project.name }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3 no-print">
  <h4 class="mb-0">Project Code</h4>
  <button class="btn btn-warning fw-bold" onclick="window.print()"><i class="bi bi-printer"></i> Print</button>
</div>

<div class="d-flex justify-content-center">
  <div class="label-card" style="width: 260px; padding: 20px;">
    <div style="font-weight:700; font-size:1.1rem;">{{ project.name }}</div>
    <div id="project-qr" class="d-flex justify-content-center my-2"></div>
    <div style="font-size:1.3rem; font-weight:700; letter-spacing:1px;">{{ project.code }}</div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
new QRCode(document.getElementById('project-qr'), { text: "{{ project.code }}", width: 160, height: 160 });
</script>
{% endblock %}
