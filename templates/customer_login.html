<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>My Aircraft - Winds Aloft</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  body { background: #14161a; min-height: 100vh; display: flex; align-items: center; }
  .portal-card { max-width: 400px; margin: 0 auto; }
</style>
</head>
<body>
<div class="container">
  <div class="portal-card card p-4 shadow">
    <div class="text-center mb-3">
      <i class="bi bi-airplane" style="font-size: 2.5rem; color: #14161a;"></i>
      <h4 class="mt-2 mb-0">My Aircraft</h4>
      <div class="text-muted small">Maintenance status, appointments, and hours</div>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} py-2">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ email }}" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button class="btn btn-dark w-100 fw-bold">Log In</button>
    </form>
    <div class="text-center text-muted small mt-3">Don't have an account? Ask the shop to set one up for you.</div>
  </div>
</div>
</body>
</html>
