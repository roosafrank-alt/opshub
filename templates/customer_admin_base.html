<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>{% block title %}My Aircraft{% endblock %} - Admin - OpsHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  :root { --adm-plum: #4b3f72; --adm-plum-dark: #2f2848; --adm-accent: #8a78c9; }
  body { background: #f5f3fa; min-height: 100vh; }
  .adm-navbar { background: linear-gradient(135deg, var(--adm-plum), var(--adm-plum-dark)); }
  .adm-navbar .navbar-brand { color: #fff; font-weight: 700; }
  .adm-navbar .navbar-brand .adm-sub { color: #d9d2ee; font-weight: 400; }
  .card { border: none; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card.adm-card-accent { border-top: 3px solid var(--adm-accent); }
  .btn-adm { background: var(--adm-plum); border-color: var(--adm-plum); color: #fff; }
  .btn-adm:hover { background: var(--adm-plum-dark); border-color: var(--adm-plum-dark); color: #fff; }
  .btn-outline-adm { color: var(--adm-plum); border-color: var(--adm-plum); }
  .btn-outline-adm:hover { background: var(--adm-plum); border-color: var(--adm-plum); color: #fff; }
  .adm-badge { background: var(--adm-accent); color: #fff; }
  .urgency-overdue { color: #b02a37; }
  .urgency-due_soon { color: #997404; }
  .urgency-ok { color: #198754; }
</style>
</head>
<body>
<nav class="navbar navbar-dark adm-navbar">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('customers_list') }}">
      <i class="bi bi-airplane-engines"></i> My Aircraft <span class="adm-sub small">Admin</span>
    </a>
    <div class="d-flex align-items-center gap-3">
      <span class="text-light small d-none d-sm-inline">{{ logged_in_user_name }}</span>
      <a href="{{ url_for('home_launcher') }}" class="btn btn-outline-light btn-sm"><i class="bi bi-grid-3x3-gap"></i> Hub</a>
      <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Log Out</a>
    </div>
  </div>
</nav>
<div class="container py-3">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
