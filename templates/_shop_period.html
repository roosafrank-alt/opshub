{#- Period picker shared by Manage > Labor Pay / Billing / Stats (see
   _shop_period() in app.py): quick buttons plus a custom from/to range.
   The including page sets `period_endpoint`. #}
<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
  <div class="btn-group flex-wrap" role="group">
    {% for key, name in periods %}
    <a href="{{ url_for(period_endpoint, period=key) }}" class="btn btn-sm {{ 'btn-dark' if period == key else 'btn-outline-dark' }}">{{ name }}</a>
    {% endfor %}
  </div>
  <form method="get" class="d-flex align-items-center gap-1 flex-wrap">
    <input type="date" name="from" class="form-control form-control-sm" style="width:auto;" value="{{ start if period == 'custom' else '' }}" aria-label="From">
    <span class="small text-muted">to</span>
    <input type="date" name="to" class="form-control form-control-sm" style="width:auto;" value="{{ end if period == 'custom' else '' }}" aria-label="To">
    <button class="btn btn-sm {{ 'btn-dark' if period == 'custom' else 'btn-outline-dark' }}">Go</button>
  </form>
</div>
